{{define "title"}}登入 - TheShop 後台{{end}}
{{define "content"}}
<section class="card login-card">
  <h1>TheShop 後台</h1>
  <form method="post" action="/login" class="stack">
    <label>帳號<input type="text" name="account" value="{{.Account}}" required autofocus autocomplete="username"></label>
    <label>密碼<input type="password" name="password" required autocomplete="current-password"></label>
    <button type="submit" class="btn btn-primary">登入</button>
  </form>
</section>
{{end}}
